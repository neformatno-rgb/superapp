<html lang="ru">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A5BD7}a:hover{color:#1E47B0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 32px; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #12141A">
<div style="height: 44px; display: flex; align-items: center">
<a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #12141A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em">Введите номер телефона</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #5A6072">Мы отправим SMS с кодом подтверждения</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="phone" style="font-size: 13px; font-weight: 500; color: #5A6072">Номер телефона</label>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Код страны: Россия, +7" style="height: 52px; padding: 0 12px; border-radius: 14px; border: 1px solid #D5D9E2; background: #F6F7F9; font-family: inherit; font-size: 16px; font-weight: 500; color: #12141A; display: flex; align-items: center; gap: 6px">+7<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<input id="phone" type="tel" inputmode="tel" value="912 345-67-89" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid {{accent}}; background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 500; color: #12141A; letter-spacing: 0.02em">
</div>
</div>
<div style="flex-grow: 1"></div>
<a href="Code.dc.html" style="height: 52px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Получить код</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2A5BD7","options":["#2A5BD7","#5B3FD6","#0F7B6C","#12141A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2A5BD7' };
}
}
</script>
