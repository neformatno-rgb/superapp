<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Неделя — вариант «Цветок»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3783FF}a:hover{color:#2A6FE0}
@keyframes petGrow{0%{transform:scaleX(0);opacity:0}60%{opacity:1}80%{transform:scaleX(1.06)}100%{transform:scaleX(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes coreIn{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes hotGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(55,131,255,0))}50%{filter:drop-shadow(0 0 8px rgba(55,131,255,0.8))}}
@keyframes countIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pet{transform-box:fill-box;transform-origin:0% 50%;animation:petGrow 700ms cubic-bezier(.2,.8,.2,1) both;transition:filter 200ms}
.pet:hover{filter:brightness(1.35)}
.pet-hot{animation:petGrow 700ms cubic-bezier(.2,.8,.2,1) both,hotGlow 2.4s ease-in-out 1.6s infinite}
.lbl{animation:fadeUp 400ms ease-out both}
.core{transform-box:fill-box;transform-origin:50% 50%;animation:coreIn 500ms cubic-bezier(.2,.8,.2,1) both}
.ring{transform-box:view-box;transform-origin:383px 122px;animation:ringSpin 40s linear infinite}
.bub{animation:fadeUp 400ms ease-out 1.25s both}
.num{animation:countIn 500ms ease-out both}
@media (prefers-reduced-motion: reduce){.pet,.pet-hot,.lbl,.core,.ring,.bub,.num{animation:none}}
</style>
</helmet>
<section aria-label="Грузы за неделю" style="width: 579px; height: 244px; box-sizing: border-box; border-radius: 12px; background: #FFFFFF; position: relative; font-family: Roboto, system-ui, sans-serif; color: #233F55; overflow: hidden">
<sc-if value="{{show}}" hint-placeholder-val="{{ true }}">

<div class="num" style="position: absolute; left: 24px; top: 172px; animation-delay: 1.25s"><div style="font-size: 30px; line-height: 34px; color: #3783FF">357</div><div style="font-size: 12px; line-height: 16px; color: #607889">Грузов было в понедельник</div></div>
<svg width="579" height="244" viewBox="0 0 579 244" role="img" aria-label="Цветок недели: длина лепестка — число грузов, пик в среду, в понедельник 357" style="position: absolute; left: 0; top: 0">
<defs><linearGradient id="petHot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6FE0"></stop><stop offset="1" stop-color="#7DB0FF"></stop></linearGradient>
<linearGradient id="petDim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3F5F7"></stop><stop offset="1" stop-color="#E6EBEE"></stop></linearGradient></defs>

<g transform="rotate(-90.00 383 122)"><rect class="pet pet-hot" style="animation-delay: 150ms, 1.6s" x="413.0" y="111" width="35.5" height="22" rx="11" fill="url(#petHot)" ></rect></g><g transform="rotate(-38.57 383 122)"><rect class="pet" style="animation-delay: 260ms" x="413.0" y="111" width="55.9" height="22" rx="11" fill="url(#petDim)" stroke="#C1CDD6" stroke-width="1"></rect></g><g transform="rotate(12.86 383 122)"><rect class="pet" style="animation-delay: 370ms" x="413.0" y="111" width="78.0" height="22" rx="11" fill="url(#petDim)" stroke="#C1CDD6" stroke-width="1"></rect></g><g transform="rotate(64.29 383 122)"><rect class="pet" style="animation-delay: 480ms" x="413.0" y="111" width="73.1" height="22" rx="11" fill="url(#petDim)" stroke="#C1CDD6" stroke-width="1"></rect></g><g transform="rotate(115.71 383 122)"><rect class="pet" style="animation-delay: 590ms" x="413.0" y="111" width="60.0" height="22" rx="11" fill="url(#petDim)" stroke="#C1CDD6" stroke-width="1"></rect></g><g transform="rotate(167.14 383 122)"><rect class="pet" style="animation-delay: 700ms" x="413.0" y="111" width="60.0" height="22" rx="11" fill="url(#petDim)" stroke="#C1CDD6" stroke-width="1"></rect></g><g transform="rotate(218.57 383 122)"><rect class="pet" style="animation-delay: 810ms" x="413.0" y="111" width="35.5" height="22" rx="11" fill="url(#petDim)" stroke="#C1CDD6" stroke-width="1"></rect></g><text class="lbl" style="animation-delay: 500ms" x="383.0" y="46.5" text-anchor="middle" font-size="11" font-weight="700" font-family="Roboto, sans-serif" fill="#3783FF">П</text><text class="lbl" style="animation-delay: 610ms" x="461.1" y="63.7" text-anchor="middle" font-size="11" font-weight="500" font-family="Roboto, sans-serif" fill="#607889">В</text><text class="lbl" style="animation-delay: 720ms" x="501.9" y="153.1" text-anchor="middle" font-size="11" font-weight="500" font-family="Roboto, sans-serif" fill="#607889">С</text><text class="lbl" style="animation-delay: 830ms" x="433.8" y="231.5" text-anchor="middle" font-size="11" font-weight="500" font-family="Roboto, sans-serif" fill="#607889">Ч</text><text class="lbl" style="animation-delay: 940ms" x="337.9" y="219.7" text-anchor="middle" font-size="11" font-weight="500" font-family="Roboto, sans-serif" fill="#607889">П</text><text class="lbl" style="animation-delay: 1050ms" x="281.6" y="149.1" text-anchor="middle" font-size="11" font-weight="500" font-family="Roboto, sans-serif" fill="#607889">С</text><text class="lbl" style="animation-delay: 1160ms" x="320.9" y="76.4" text-anchor="middle" font-size="11" font-weight="500" font-family="Roboto, sans-serif" fill="#607889">В</text><circle class="core" cx="383" cy="122" r="26" fill="#F3F5F7" stroke="#E6EBEE"></circle>
<text class="lbl" style="animation-delay: 300ms" x="383" y="124" text-anchor="middle" font-size="10" font-family="Roboto, sans-serif" fill="#607889">неделя</text>
<text x="383" y="30.5" text-anchor="middle" font-size="12" font-weight="700" font-family="Roboto, sans-serif" fill="#FFFFFF"></text>
</svg>
<div class="bub" style="position: absolute; left: 399px; top: 51px; height: 24px; padding: 0 10px; border-radius: 12px; background: #3783FF; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; box-shadow: 0 4px 14px rgba(55,131,255,0.4)">357</div>
</sc-if>
<div style="position: absolute; left: 24px; top: 100px"><button type="button" onClick="{{replay}}" style="height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: #E9F2FF; font-family: inherit; font-size: 12px; font-weight: 500; color: #3783FF; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>Повторить анимацию</button></div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":579,"height":244}}'>
class Component extends DCLogic {
renderVals() {
const show = this.state.hide ? false : true;
return {
show,
replay: () => { this.setState({ hide: true }, () => setTimeout(() => this.setState({ hide: false }), 40)); }
};
}
}
</script>
