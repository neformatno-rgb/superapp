</div>
<button type="button" style="margin-top: 36px; height: 48px; border: 0; border-radius: 4px; background: {{accent}}; font-family: inherit; font-size: 16px; font-weight: 500; color: #233F55">Продолжить</button>
<div style="margin-top: 20px; display: flex; align-items: center; gap: 12px">
<div style="flex-grow: 1; height: 1px; background: #E6EBEE"></div>
<span style="font-size: 13px; line-height: 16px; color: #607889">или</span>

<p style="margin: 0; font-size: 12px; line-height: 16px; color: #607889">Круглосуточная поддержка</p>
<p style="margin: 19px 0 0; font-size: 12px; line-height: 16px; color: #95AABA">Версия 1.0.0</p>
</div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FECA3A"},"$preview":{"width":360,"height":640}}'>
