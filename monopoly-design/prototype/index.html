<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Поиск грузов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — top bar, collapsible icon sidebar, content column of filter card + order cards; phone: no sidebar, floating bottom nav */
:root{
  --bg:#F8F9FA;--surface:#FFFFFF;--subtle:#F3F5F7;--line:#E6EBEE;--tint:rgba(55,131,255,0.10);--tint-hover:rgba(55,131,255,0.15);--border:#C1CDD6;
  --accent:#3783FF;--accent-text:#3783FF;--accent-soft:rgba(55,131,255,0.12);--t1:#233F55;--t2:#607889;--grey64:#95AABA;--on-accent:#FFFFFF;
  --error:#D93A3A;--overlay:rgba(18,30,44,0.45);--shadow:0 8px 28px rgba(35,63,85,0.14);--shadow-sm:0 4px 12px rgba(35,63,85,0.10);--subtle-2:#F8F9FA;--shadow-card:0 7px 24px rgba(35,63,85,0.12);--purple:#874AD7;--purple-bg:rgba(135,74,215,0.10);
  --font:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060709;--surface:#202632;--subtle:#333B4B;--line:#434B5C;--tint:rgba(111,170,255,0.22);--tint-hover:rgba(111,170,255,0.30);--border:#636D82;
  --accent:#6FAAFF;--accent-text:#9CC8FF;--accent-soft:rgba(102,164,255,0.36);--t1:#FAFBFE;--t2:#ADB5C6;--grey64:#8A95A7;--on-accent:#FFFFFF;
  --error:#FF6B6B;--overlay:rgba(0,0,0,0.6);--shadow:0 8px 28px rgba(0,0,0,0.5);--shadow-sm:0 4px 12px rgba(0,0,0,0.35);--subtle-2:#2C3341;--shadow-card:0 7px 24px rgba(0,0,0,0.43);--purple:#B58AF0;--purple-bg:rgba(160,110,255,0.18);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060709;--surface:#202632;--subtle:#333B4B;--line:#434B5C;--tint:rgba(111,170,255,0.22);--tint-hover:rgba(111,170,255,0.30);--border:#636D82;
  --accent:#6FAAFF;--accent-text:#9CC8FF;--accent-soft:rgba(102,164,255,0.36);--t1:#FAFBFE;--t2:#ADB5C6;--grey64:#8A95A7;--on-accent:#FFFFFF;
  --error:#FF6B6B;--overlay:rgba(0,0,0,0.6);--shadow:0 8px 28px rgba(0,0,0,0.5);--shadow-sm:0 4px 12px rgba(0,0,0,0.35);--subtle-2:#2C3341;--shadow-card:0 7px 24px rgba(0,0,0,0.43);--purple:#B58AF0;--purple-bg:rgba(160,110,255,0.18);color-scheme:dark}
html,body{height:100%}
body{min-width:320px}
html{scrollbar-gutter:stable;overflow-y:scroll}
body{background:var(--surface);color:var(--t1);font-family:var(--font)}
*{box-sizing:border-box}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;height:64px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;background:var(--surface)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.hbtns{display:flex;align-items:center;gap:8px}
.ghost{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--t2);padding:0;display:flex;align-items:center;justify-content:center}
.ghost:hover{background:var(--subtle);color:var(--t1)}
.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700;letter-spacing:-0.01em}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.proto{height:20px;padding:0 7px;border-radius:6px;background:var(--subtle);color:var(--t2);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center}
.row{flex:1;display:flex;min-height:0}
.side{position:sticky;top:64px;align-self:flex-start;height:calc(100vh - 64px);flex-shrink:0;width:64px;padding:16px 8px 16px max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:width 260ms cubic-bezier(.2,.8,.2,1)}
.side.open{width:236px}
.nv{width:100%;height:40px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--t2);display:flex;align-items:center;gap:12px;text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;flex-shrink:0}
.nv svg{flex-shrink:0}
.nv:hover{background:var(--subtle);color:var(--t1)}
.nv.on{background:var(--tint);color:var(--accent-text)}
.nv .lb,.nv .end{opacity:0;transition:opacity 180ms}
.side.open .lb,.side.open .end{opacity:1}
.nv .end{margin-left:auto;display:flex}
.sw{width:32px;height:18px;border-radius:9px;background:var(--border);position:relative;transition:background 200ms}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left 200ms}
.sw.on{background:var(--accent)}.sw.on::after{left:16px}
.main{flex:1;min-width:0;background:var(--bg);border-top-left-radius:20px;padding:24px max(24px,env(safe-area-inset-right,0px)) 40px 24px;display:flex;flex-direction:column;gap:16px}
.corner{position:sticky;top:64px;align-self:flex-start;width:0;height:0;z-index:14;pointer-events:none}
.corner::after{content:"";position:absolute;left:0;top:0;width:20px;height:20px;background:radial-gradient(circle at 100% 100%,transparent 19.5px,var(--surface) 20px)}
.main>*{width:100%;max-width:1166px;margin-left:auto;margin-right:auto}
h1{margin:0;font-size:24px;line-height:28px;font-weight:700;text-wrap:balance}
.tabs{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tab{height:32px;padding:0 12px;border:0;border-radius:16px;background:transparent;color:var(--t2);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.tab{transition:background-color 160ms,color 160ms}
.tab:not(.on):hover{background:rgba(255,255,255,0.1);color:var(--t1)}
.tab.on{background:var(--surface);color:var(--t1)}
.tab{font-weight:400}.tab.on{font-weight:500}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.srch{margin-left:auto;width:260px;max-width:100%;height:32px;border-radius:8px;background:var(--surface);display:flex;align-items:center;padding:0 8px;gap:4px;color:var(--t2)}
.srch-btn{width:24px;height:24px;flex-shrink:0;border:0;padding:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;cursor:default}
.srch.collapsed{width:32px;padding:0;justify-content:center}
.srch.collapsed .inp{display:none}
.srch.collapsed .srch-btn{width:32px;height:32px;border-radius:8px;cursor:pointer}
.srch.collapsed .srch-btn:hover{color:var(--t1)}
.srch.collapsed.expanded{position:absolute;right:0;top:0;z-index:5;width:260px;max-width:100%;padding:0 4px 0 8px;box-shadow:var(--shadow)}
.srch.collapsed.expanded .inp{display:block}
.srch.collapsed.expanded .srch-btn{width:24px;height:24px}
.inp{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--t1);font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.inp::placeholder{color:var(--t2);opacity:1}
.inp::-webkit-search-cancel-button{-webkit-appearance:none}
.card{border-radius:12px;background:var(--surface)}
.filters{padding:16px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;align-items:center;gap:12px;min-width:0}
.fbtn{width:132px;justify-content:center;height:32px;padding:0 10px;border-radius:8px;background:var(--subtle);color:var(--t2);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;flex-shrink:0}
.fld{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 4px 0 8px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--t2);min-width:0}
.fld.city{flex:1.5 1 0;width:0}.fld.small{flex:1 1 0;width:0}
.sel{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--t1);font-size:14px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.sel.ph{color:var(--grey64);font-size:14px;font-weight:400}
.fld{position:relative}
.fld .sel{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.fv-btn{flex:1;width:100%;min-width:0;overflow:hidden;height:100%;border:0;background:transparent;padding:0;color:var(--t2);display:flex;align-items:center;gap:6px;cursor:pointer;text-align:left}
.fv-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.fv{flex:1;min-width:0;font-size:14px;font-weight:400;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv.ph{color:var(--grey64)}
.fld.open{border-color:var(--accent)}
.fld.open .fv-btn svg{transform:rotate(180deg)}
.fv-btn svg{transition:transform 160ms}
.fld-clear{display:none;width:24px;height:24px;flex-shrink:0;border:0;padding:0;background:transparent;color:var(--t2);align-items:center;justify-content:center;border-radius:4px;cursor:pointer}
.fld-clear:hover{color:var(--t1)}
.fld.has .fld-clear{display:flex}
.fld.has .fld-clear ~ *{}
.fld[data-dd="fDay"].has .fv-btn svg{display:none!important}
.fld[data-dd="fDay"].open .fv-btn svg{transform:none}
.menu{position:fixed;left:0;top:0;z-index:60;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:4px;max-height:224px;overflow-y:auto;overscroll-behavior:contain;display:none}
.menu.open{display:block}
.mi{width:100%;height:36px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--t2);font-size:14px;font-weight:400;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--subtle);color:var(--t1);outline:none}
.mi[aria-selected="true"]{color:var(--accent-text);font-weight:500}
.sel option{background:var(--surface);color:var(--t1)}
.ibtn{width:32px;height:32px;flex-shrink:0;border:0;border-radius:8px;background:var(--subtle);color:var(--t2);padding:0;display:flex;align-items:center;justify-content:center}
.ibtn:hover{color:var(--t1)}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--t2);font-size:14px;transition:background 160ms,color 160ms,border-color 160ms}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);color:var(--accent-text)}
.dd{position:relative;height:32px;border-radius:8px;background:var(--subtle);color:var(--t2);display:flex;align-items:center;padding:0 10px 0 12px;gap:8px;cursor:pointer;transition:background 160ms,color 160ms}
.dd:hover{color:var(--t1)}
.ddsel{border:0;background:transparent;color:inherit;font-size:14px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;padding:0}
.dd-clear{display:none;width:16px;height:16px;margin-left:-4px;border:0;padding:0;background:transparent;color:inherit;align-items:center;justify-content:center;border-radius:4px;cursor:pointer}
.dd.on .dd-clear{display:flex}
.dd.on .dd-btn svg{display:none!important}
.dd.on{background:var(--tint);color:var(--accent-text)}
.dd.on.open{color:var(--accent-text)}
.dd .ddsel{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.dd-btn{flex:0 0 auto;width:auto;overflow:visible;color:inherit;gap:8px}
.dd-btn .fv,.dd-btn .fv.ph{color:inherit;flex:0 0 auto;overflow:visible}
.dd.open .fv-btn svg{transform:rotate(180deg)}
.dd.open{color:var(--t1)}
.dd.on.open{color:var(--accent-text)}
.ddsel option{background:var(--surface);color:var(--t1)}
.reset{height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--tint);color:var(--accent-text);font-size:14px;font-weight:500}
.bar{min-height:48px;border-top:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.found{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.lnk{border:0;background:transparent;padding:0;color:var(--accent-text);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer}
.ddl{position:relative;display:flex;align-items:center}
.ddl .ddsel{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.ddl .fv-btn{flex:0 0 auto;width:auto;overflow:visible;height:32px;color:var(--accent-text);gap:8px}
.ddl .fv,.ddl .fv.ph{flex:0 0 auto;overflow:visible;color:inherit;font-weight:500}
.ddl.open .fv-btn svg{transform:rotate(180deg)}
.sortsel{padding:0;border:0;background:transparent;color:var(--accent-text);font-size:14px;font-weight:500;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.list{display:flex;flex-direction:column;gap:8px}
.order{padding:12px 16px;display:flex;gap:16px;transition:box-shadow 200ms}
.order:hover{box-shadow:var(--shadow-card)}
.oleft{flex:1;min-width:0;display:flex;flex-direction:column}
.ohead{min-height:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{height:24px;padding:0 8px;border:0;border-radius:8px;background:var(--subtle);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--t2)}
.pill .ck{display:none}.pill.done .ck{display:block}.pill.done .cp{display:none!important}
.pill.rate{gap:4px;color:var(--t1)}
.tag{height:22px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600;display:flex;align-items:center;margin-left:auto;white-space:nowrap}
.tags{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tags .tag{margin-left:0}
.tag.t-fix{background:var(--purple-bg);color:var(--purple)}
.tag.t-auc{background:var(--tint);color:var(--accent-text)}
.tag.t-cnt{background:var(--subtle);color:var(--t1)}
.hr{height:1px;background:var(--line);margin:8px 0 10px}
.ogrid{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1.3fr) 200px;column-gap:16px;align-items:start}
.place{min-width:0;display:flex;flex-direction:column;gap:2px}
.place>span,.spec>span{display:block;width:fit-content;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec{min-width:0}
.city{font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg{font-size:13px;line-height:18px;color:var(--t2)}
.when{font-size:14px;line-height:20px;color:var(--t2);white-space:nowrap}
.when b{font-weight:600;color:var(--t1)}
.mid{padding-top:4px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--border)}
.mid .arr{display:flex;align-items:center;justify-content:center;gap:6px;min-height:18px}
.km{font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}
.plus{height:18px;padding:0 7px;border-radius:9px;background:var(--tint);color:var(--accent-text);font-size:12px;font-weight:600;display:flex;align-items:center}
.spec{display:flex;flex-direction:column;align-items:flex-end;justify-self:end;gap:2px;text-align:right}
.spec .bt{font-size:14px;line-height:20px;font-weight:500}
.vdiv{width:1px;background:var(--line);align-self:stretch;margin:4px 0}
.oright{width:236px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.badges{height:28px;display:flex;align-items:center;gap:6px}
.bdg{width:28px;height:28px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center}
.bonus{margin-left:auto;height:26px;padding:0 8px 0 5px;border-radius:13px;background:var(--subtle);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.coin{width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.perkm{font-size:14px;color:var(--t2);white-space:nowrap;font-variant-numeric:tabular-nums}
.price{font-size:18px;line-height:24px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;margin-top:auto}
.cta{flex:1;height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--tint);color:var(--accent-text);font-size:14px;font-weight:500;transition:background-color 160ms}
.cta:hover:not(:disabled),.reset:hover{background:var(--tint-hover)}
.reset{transition:background-color 160ms}
.cta.done{background:var(--subtle);color:var(--t2);cursor:default}
.book{width:32px;height:32px;border:0;border-radius:8px;background:var(--subtle);color:var(--t2);padding:0;display:flex;align-items:center;justify-content:center}
.book[aria-pressed="true"]{background:var(--tint);color:var(--accent-text)}
.book .solid{display:none}
.book[aria-pressed="true"] .solid{display:block}
.empty{padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--t2)}
.empty b{font-size:16px;color:var(--t1)}
.pager{min-height:48px;padding:8px 16px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pinfo{font-size:14px;color:var(--t2);font-variant-numeric:tabular-nums;margin-right:auto}
.pg{min-width:32px;height:32px;padding:0 6px;border:0;border-radius:8px;background:transparent;color:var(--t2);font-size:14px;font-weight:400;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:2px}
.pg:hover:not(:disabled){color:var(--t1)}
.pg.on{background:var(--tint);color:var(--accent-text);font-weight:500}
.pg:disabled{opacity:.4;cursor:default}
.pg.gap{cursor:default}
.note{margin:0;font-size:12px;color:var(--t2)}
.nv.on:hover,.chip[aria-pressed="true"]:hover,.dd.on:hover,.book[aria-pressed="true"]:hover,.pg.on:hover,.bn.on:hover{background:var(--tint-hover)}
.nv,.chip,.dd,.book,.pg,.bn{transition:background-color 160ms,color 160ms,border-color 160ms}
.bnav{display:none}
.modal{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:400px;max-width:100%;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:18px;line-height:24px}
.big{height:44px;border:1px solid var(--border);border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:18px}
.big .inp{font-size:18px}
.err{font-size:13px;color:var(--error)}
.dlg .btns{display:flex;gap:8px;margin-top:4px}
.prim{flex:1;height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600}
.sec{height:44px;border:0;border-radius:10px;background:var(--subtle);color:var(--t1);font-size:15px;font-weight:500;padding:0 16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--t1);color:var(--surface);font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:tIn 220ms ease-out both}

  // ---------- custom dropdowns for inputs ----------
  const dds = Array.from(document.querySelectorAll('[data-dd]'));
  function buildMenus() {
    dds.forEach((w) => {
      const sel = w.querySelector('select'); const menu = w._menu || w.querySelector('.menu');
      menu.innerHTML = Array.from(sel.options).map((o) => '<button type="button" class="mi" role="option" data-v="' + esc(o.value) + '">' + esc(o.value ? o.text : 'Любой') + '</button>').join('');
    });
  }
  function syncDD() {
    dds.forEach((w) => {
      const sel = w.querySelector('select'); const fv = w.querySelector('.fv');
      const o = sel.options[sel.selectedIndex];
      fv.textContent = o ? o.text : ''; fv.classList.toggle('ph', !sel.value);
      w.classList.toggle('has', !!sel.value);
      (w._menu || w).querySelectorAll('.mi').forEach((b) => b.setAttribute('aria-selected', b.dataset.v === sel.value));
    });
  }
  function closeDD(except) {
    dds.forEach((w) => { if (w !== except && w.classList.contains('open')) { w.classList.remove('open'); w._menu.classList.remove('open'); w.querySelector('.fv-btn').setAttribute('aria-expanded', 'false'); } });
  }
  dds.forEach((w) => {
    const btn = w.querySelector('.fv-btn'); const menu = w.querySelector('.menu'); const sel = w.querySelector('select');
    w._menu = menu; document.body.appendChild(menu);
    const clr = w.querySelector('.dd-clear, .fld-clear');
    if (clr) clr.addEventListener('click', (e) => { e.stopPropagation(); sel.value = ''; sel.dispatchEvent(new Event('change')); closeDD(); btn.focus(); });
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !w.classList.contains('open'); closeDD(w);
      w.classList.toggle('open', open); menu.classList.toggle('open', open); btn.setAttribute('aria-expanded', open);
      if (open) placeMenu(w);
      if (open) { const cur = menu.querySelector('[aria-selected="true"]') || menu.firstElementChild; if (cur) { cur.scrollIntoView({ block: 'nearest' }); cur.focus(); } }
    });
    menu.addEventListener('click', (e) => {
      const it = e.target.closest('.mi'); if (!it) return; e.stopPropagation();
      sel.value = it.dataset.v; sel.dispatchEvent(new Event('change')); closeDD(); btn.focus();
    });
    menu.addEventListener('keydown', (e) => {
      const items = Array.from(menu.querySelectorAll('.mi')); const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
      else if (e.key === 'Escape') { closeDD(); btn.focus(); }
    });
    w.addEventListener('click', (e) => { if (e.target === w) btn.click(); });
  });
  function placeMenu(w) {
    const r = w.getBoundingClientRect(); const m = w._menu;
    const w2 = Math.max(r.width, w.classList.contains('dd') || w.classList.contains('ddl') ? 200 : 0);
    const lx = w.dataset.align === 'right' ? r.right - w2 : r.left;
    m.style.width = w2 + 'px'; m.style.left = Math.max(8, Math.min(lx, window.innerWidth - w2 - 8)) + 'px';
    const below = window.innerHeight - r.bottom; const h = Math.min(m.scrollHeight, 224);
    m.style.top = (below < h + 12 && r.top > h + 12 ? r.top - h - 4 : r.bottom + 4) + 'px';
  }
  document.addEventListener('click', () => closeDD());
  window.addEventListener('resize', () => closeDD());
  window.addEventListener('scroll', () => dds.forEach((w) => { if (w.classList.contains('open')) placeMenu(w); }), true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDD(); });
  buildMenus();

    const anyType = types.some((t) => S.types[t]);

  const hpick = (a, h) => a[h % a.length];
  const initials = (n) => { const w = n.split(/\s+/); if (w.length > 1) return (w[0][0] + w[1][0]).toUpperCase(); const caps = n.match(/[А-ЯA-Z]/g) || [n[0]]; return (caps[0] + (caps[1] || n[1] || '')).toUpperCase(); };

  function orderInfo(o) {
    const h = hashStr(o.id);
    const company = hpick(COMPANIES, h);
    const pts = [{ kind: 'ld', city: o.from, reg: o.fromReg, day: o.fromDay, key: o.id + 'f' }];
    for (let i = 0; i < o.stops; i++) {
      const c = cities[(h >> (3 + i * 4)) % cities.length];
      const city = (c[0] === o.from || c[0] === o.to) ? cities[(h + 5 + i) % cities.length] : c;
      pts.push({ kind: 'ul', city: city[0], reg: city[1], day: Math.round(o.fromDay + (o.toDay - o.fromDay) * (i + 1) / (o.stops + 1)), key: o.id + 's' + i, part: true });
    }
    pts.push({ kind: 'ul', city: o.to, reg: o.toReg, day: o.toDay, key: o.id + 't' });
    pts.forEach((p, i) => {
      const k = hashStr(p.key);
      const g = GEO[p.city] || [55 + (k % 500) / 100, 37 + (k % 900) / 100];
      p.addr = p.city + ' (' + p.reg + '), ' + hpick(STREETS, k) + ', д. ' + (1 + k % 87);
      p.geo = (g[0] + ((k >> 5) % 200 - 100) / 2000).toFixed(4) + ', ' + (g[1] + ((k >> 9) % 200 - 100) / 2000).toFixed(5);
      p.site = hpick(SITES, k >> 3) + ' | ' + phone(k);
      p.note = hpick(NOTES, k >> 6);
      p.rating = (4 + (k % 10) / 10).toFixed(1).replace('.', ',');
    });
    return { company, ini: initials(company), views: 40 + h % 360, oRating: (4 + ((h >> 5) % 10) / 10).toFixed(1).replace('.', ','),
             pts, cargoValue: (300 + (h >> 7) % 1700) * 1000, payDays: [5, 7, 10, 14, 20, 30][(h >> 11) % 6] };
  }

  const V = { id: null, edit: false, seg: 'tariff', pay: true, map: false, only: false, closed: {}, docs: {}, offer: '' , listY: 0 };

  function propHTML(icon, label, value) { return '<div class="prop">' + DI[icon] + '<span><small>' + label + '</small><b>' + esc(value) + '</b></span></div>'; }

  function detailHTML(o) {
    const X = orderInfo(o);
    const k = vatK();
    const price = o.price * k;
    const saved = !!S.saved[o.id], taken = !!S.taken[o.id], offered = S.offers[o.id];
    const gross = Math.round(o.kg * 1.05 / 10) * 10;
    const cargoLine = esc(o.cargo) + ' — ' + o.pl + ' плт, Бр./Нетто (кг): ' + nf(gross) + '/' + nf(o.kg) + ', Стоимость: ' + money(X.cargoValue);
    let h = '';
    // head
    h += '<div class="dhead"><button type="button" class="dback" data-d="back">' + DI.back + 'К грузам</button><span style="flex:1"></span>' +
      '<button type="button" class="sq" data-d="share" aria-label="Поделиться заявкой">' + DI.share + '</button>' +
      '<button type="button" class="sq" data-d="save" aria-pressed="' + saved + '" aria-label="' + (saved ? 'Убрать из избранного' : 'В избранное') + '">' + BOOK24 + '</button></div>';
    h += '<div class="dl">';
    // summary
    h += '<section class="dcard dsum" aria-label="Заявка ' + o.id + '"><div class="rbox">' +
      '<div><div class="c" title="' + esc(o.from) + '">' + esc(o.from) + '</div><div class="w">' + winHTML(o.fromDay, o.id + 'f') + '</div></div>' +
      '<div class="mid2"><div class="arr2">' + DI.arrS + (o.stops ? '<span class="plus2" title="Промежуточные точки">+' + o.stops + '</span>' : '') + DI.arrS + '</div><span class="km2">' + nf(o.dist) + ' км</span></div>' +
      '<div class="end"><div class="c" title="' + esc(o.to) + '">' + esc(o.to) + '</div><div class="w">' + winHTML(o.toDay, o.id + 't') + '</div></div></div>' +
      '<div class="co"><span class="ava" aria-hidden="true">' + X.ini + '</span><span class="coname"><b>' + esc(X.company) + '</b><button type="button" data-d="profile">Профиль компании</button></span>' +
      '<div class="minis"><button type="button" class="mini" data-d="chat" aria-label="Чат с ' + esc(X.company) + '">' + sqb(SQ_B, 'sqmB') + '<span class="chat">' + DI.chat + '</span>Чат</button>' +
      '<span class="mini" title="Рейтинг компании">' + sqb(SQ_B, 'sqmB') + I.star + o.rating + '</span></div><span class="vsep" aria-hidden="true"></span>' +
      '<div class="minis"><span class="mini" title="Просмотры заявки">' + sqb(SQ_B, 'sqmB') + EYE16 + X.views + '</span><span class="mini" title="Рейтинг заявки">' + sqb(SQ_B, 'sqmB') + I.star + X.oRating + '</span></div></div></section>';
    // tabs
    h += '<div class="dtabs" role="tablist" aria-label="Разделы заявки">' +
      [['cond', 'Условия перевозки'], ['route', 'Маршрут и груз'], ['extra', 'Дополнительно'], ['docs', 'Документы']].map(([id, t], i) => '<button type="button" class="tab' + (i === 0 ? ' on' : '') + '" data-d="jump" data-to="' + id + '">' + t + '</button>').join('') + '</div>';
    // conditions
    h += '<section class="dcard dsec" id="d-cond"><h2>Условия перевозки</h2><div class="props">' +
      propHTML('kuzov', 'Тип кузова', o.body) + propHTML('params', 'Параметры кузова', o.t + ' т | ' + o.m3 + ' м³') +
      propHTML('load', 'Тип погрузки', loadType(o.body)) + propHTML('temp', 'Температурный режим', tempMode(o.body)) +
      '</div><h3>Параметры транспорта</h3><div class="props">' +
      propHTML('kuzov', 'Тип кузова', o.body) + propHTML('params', 'Параметры кузова', 'от ' + o.t + ' т | от ' + o.m3 + ' м³ | ' + o.pl + ' плт') +
      propHTML('load', 'Тип погрузки', loadType(o.body)) + propHTML('temp', 'Температурный режим', tempMode(o.body)) + '</div></section>';
    // route
    h += '<section class="dcard dsec' + (V.only ? ' only-cargo' : '') + '" id="d-route"><div class="rhd"><h2>Маршрут</h2>' +
      '<button type="button" class="only" role="switch" aria-checked="' + V.only + '" data-d="only">Показать только грузы<span class="sw' + (V.only ? ' on' : '') + '"></span></button>' +
      (function () { const anyOpen = X.pts.some((p, i) => !V.closed[i]); return '<button type="button" class="xall" data-d="all" aria-label="' + (anyOpen ? 'Свернуть все точки' : 'Раскрыть все точки') + '" title="' + (anyOpen ? 'Свернуть все точки' : 'Раскрыть все точки') + '">' + (anyOpen ? EXPAND_ALL : COLLAPSED_ALL) + '</button>'; })() + '</div>' +
      '<div class="map' + (V.map ? ' open' : '') + '"><img src="' + MAP_SRC + '" alt="Карта маршрута ' + esc(o.from) + ' — ' + esc(o.to) + '">' +
      '<span class="mpill">' + nf(o.dist) + ' км — ' + (price / o.dist).toFixed(2).replace('.', ',') + ' ₽/км</span>' +
      '<button type="button" class="mbtn" data-d="map" aria-expanded="' + V.map + '">' + (V.map ? 'Скрыть карту' : 'Показать карту') + CHEV16 + '</button></div><div class="stops">';
    X.pts.forEach((p, i) => {
      const closed = !!V.closed[i];
      const label = p.kind === 'ld' ? 'Погрузка' : 'Разгрузка';
      h += '<div class="stop ' + p.kind + (closed ? ' closed' : '') + '"><span class="num ' + p.kind + '">' + (i + 1) + '</span>' +
        '<button type="button" class="shead" data-d="stop" data-i="' + i + '" aria-expanded="' + !closed + '"><span class="rpill">' + I.star + p.rating + '</span><span class="sc">' + esc(p.city) + '</span>' + CHEV24.replace('<svg ', '<svg class="chev" ') + '</button>' +
        '<span class="rail ' + p.kind + '"><span class="ring"></span></span><div class="sbody">' +
        '<div class="scard addr"><div class="trow ' + p.kind + '"><span class="ttag">' + label + (p.part ? ' (частичная)' : '') + '</span>' + plainWin(p.day, p.key) + '</div>' +
          '<button type="button" class="geo txt" data-d="geo" data-geo="' + esc(p.addr) + '" aria-label="Скопировать адрес ' + esc(p.addr) + '">' + esc(p.addr) + GEO_ICONS + '</button><button type="button" class="geo" data-d="geo" data-geo="' + p.geo + '" aria-label="Скопировать координаты ' + p.geo + '">' + p.geo + GEO_ICONS + '</button><span>' + esc(p.site) + '</span></div>' +
        '<div class="scard"><small>Груз 1</small><span>' + cargoLine + '</span></div>' +
        '<div class="scard cmt"><small>Комментарий</small><span>' + esc(p.note) + '</span></div></div></div>';
    });
    h += '</div></section>';
    // extras
    h += '<section class="dcard dsec" id="d-extra"><h2>Дополнительно</h2><div class="extras">' + EXTRAS.map((x, i) => '<div class="xitem"><img src="' + ILL[i] + '" alt=""><span><b>' + x[0] + '<button type="button" class="info" data-d="info" data-i="' + i + '" aria-label="Подробнее: ' + x[0] + '">' + INFO + '</button></b><small>' + x[1] + '</small></span></div>').join('') + '</div></section>';
    // documents
    h += '<section class="dcard dsec" id="d-docs"><h2>Документы</h2><div class="docs">' +
      DOCS.map((d, i) => { const open = !!V.docs[i]; return '<div class="doc' + (open ? ' open' : '') + '"><button type="button" class="dhd" data-d="doc" data-i="' + i + '" aria-expanded="' + open + '"><span>' + d[0] + '</span><span class="ttag ld">' + d[1] + ' шт.</span>' + CHEV24 + '</button><p class="dnote">' + d[2] + '</p></div>'; }).join('') + '</div></section>';
    h += '</div>';
    // right panel: tariff / counter-offer (edit → sent with timer)
    const canCounter = o.tags.includes('Встречное');
    const counter = canCounter && V.seg === 'counter';
    const pending = canCounter && offered && !taken;
    const editing = counter && (!pending || V.edit);
    const left = pending ? Math.max(0, OFFER_TTL - (Date.now() - (S.offerAt[o.id] || Date.now()))) : 0;
    const payHTML = '<div class="pay' + (V.pay ? '' : ' closed') + '"><button type="button" data-d="pay" aria-expanded="' + V.pay + '">Способы оплат' + CHEV16 + '</button><div class="prows">' +
        '<div>Стандартная оплата<b>за ' + X.payDays + ' дней</b></div>' +
        '<div><b>Начислим бонусов</b><span class="bonus">' + COIN + '+' + o.bonus + '</span></div></div></div>';
    let body, ctaHTML;
    if (!counter) {
      body = '<div class="cost"><small>Стоимость перевозки</small><b>' + money(price) + '</b></div>';
      ctaHTML = taken ? '<button type="button" class="big2 done" disabled>Забронировано</button>' : '<button type="button" class="big2" data-d="take">Забрать груз</button>';
    } else if (editing) {
      body = '<div class="obox"><label class="ofield2" for="dOffer"><span class="sr">Ваша цена, ₽</span><input id="dOffer" inputmode="numeric" autocomplete="off" value="' + nf(V.offer || offered || Math.round(price * 1.1 / 1000) * 1000) + '"><span>₽</span></label>' +
        '<button type="button" class="osend" data-d="send" aria-label="Отправить встречное предложение">' + CHEVR24 + '</button></div>';
      ctaHTML = '<button type="button" class="big2 sec2" data-d="close">Закрыть</button>';
    } else {
      body = '<div class="cost2"><div class="cost"><small>Начальная цена</small><b>' + money(price) + '</b></div>' +
        '<div class="cost mine"><small>Ваше предложение</small><b>' + money(offered) + '</b></div></div>';
      ctaHTML = '<button type="button" class="big2" data-d="edit">Изменить предложение</button>';
    }
    h += '<aside class="dr">' + (pending ? '<div class="wbanner" role="status"><span class="wtimer" data-left="' + left + '">' + timerText(left) + '</span></div>' : '') +
      '<div class="dcard panel' + (pending ? ' under' : '') + '">' + (canCounter ? '<div class="seg" role="tablist" aria-label="Цена">' +
      '<button type="button" role="tab" data-d="seg" data-seg="tariff" aria-selected="' + !counter + '">Тариф заказчика</button>' +
      '<button type="button" role="tab" data-d="seg" data-seg="counter" aria-selected="' + counter + '">Встречное</button></div>' : '') +
      body + payHTML + ctaHTML +
      '<div class="pnote">Цены указаны <button type="button" data-d="vat" aria-label="Переключить НДС">' + (S.vat ? 'с учетом НДС 22%' : 'без НДС') + CHEV16 + '</button></div>' +
      '</div></aside>';
    return h;
  }

  const mainEl = document.querySelector('.main');
  const detailEl = document.createElement('div');
  detailEl.id = 'detail';
  mainEl.appendChild(detailEl);

  function renderDetail() {
    const o = ALL.find((x) => x.id === V.id);
    if (!o) return;
    detailEl.innerHTML = detailHTML(o);
  }
  function showDetail(id, push) {
    const o = ALL.find((x) => x.id === id);
    if (!o) return hideDetail(false);
    if (V.id === null) V.listY = window.scrollY;
    if (V.id !== id) Object.assign(V, { edit: false, seg: 'tariff', pay: true, map: false, only: false, closed: {}, docs: {}, offer: '' });
    V.id = id;
    if (push) { try { history.pushState({ order: id }, '', '#' + encodeURIComponent(id)); } catch (e) {} }
    mainEl.classList.add('is-detail');
    renderDetail();
    window.scrollTo(0, 0);
    const b = detailEl.querySelector('.dback'); if (b) b.focus({ preventScroll: true });
  }
  function hideDetail(push) {
    if (V.id === null) return;
    const id = V.id; V.id = null;
    if (push) { try { history.pushState({}, '', location.pathname + location.search); } catch (e) {} }
    mainEl.classList.remove('is-detail');
    render();
    window.scrollTo(0, V.listY);
    const card = document.querySelector('.order[data-id="' + id + '"]'); if (card) card.focus({ preventScroll: true });
  }
  const fromHash = () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && ALL.some((x) => x.id === id)) showDetail(id, false); else hideDetail(false); };
  window.addEventListener('popstate', fromHash);
  window.addEventListener('hashchange', fromHash);

  // open from the list: any click on a card that isn't one of its buttons
  $('list').addEventListener('click', (e) => {
    if (e.target.closest('button,a,input,select')) return;
    const c = e.target.closest('.order[data-id]'); if (c) showDetail(c.dataset.id, true);
  });
  $('list').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const c = e.target.closest('.order[data-id]'); if (!c || e.target !== c) return;
    e.preventDefault(); showDetail(c.dataset.id, true);
  });
  // «Поиск грузов» in the menu returns to the list
  document.querySelectorAll('#side .nv.on, .bnav .bn.on').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); hideDetail(true); }));

  detailEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    const o = ALL.find((x) => x.id === V.id); if (!o) return;
    const X = orderInfo(o);
    switch (b.dataset.d) {
      case 'back': if (history.state && history.state.order) history.back(); else hideDetail(true); break;
      case 'share': try { navigator.clipboard.writeText(location.href).then(() => toast('Ссылка на заявку ' + o.id + ' скопирована'), () => toast('Заявка ' + o.id)); } catch (err) { toast('Заявка ' + o.id); } break;
      case 'save': if (S.saved[o.id]) { delete S.saved[o.id]; toast('Убрано из избранного'); } else { S.saved[o.id] = true; toast('Добавлено в избранное'); } store.set('saved', S.saved); renderDetail(); break;
      case 'profile': toast('Профиль компании ' + X.company + ' — в следующей итерации'); break;
      case 'chat': toast('Чат с ' + X.company + ' откроется здесь'); break;
      case 'jump': { detailEl.querySelectorAll('.dtabs .tab').forEach((t) => t.classList.toggle('on', t === b)); const s = $('d-' + b.dataset.to); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'only': V.only = !V.only; renderDetail(); break;
      case 'map': V.map = !V.map; { const m = detailEl.querySelector('.map'); m.classList.toggle('open', V.map); b.setAttribute('aria-expanded', V.map); b.firstChild.textContent = V.map ? 'Скрыть карту' : 'Показать карту'; } break;
      case 'all': { const anyOpen = X.pts.some((p, i) => !V.closed[i]); X.pts.forEach((p, i) => { V.closed[i] = anyOpen; }); renderDetail(); const nb = detailEl.querySelector('[data-d="all"]'); if (nb) nb.focus(); break; }
      case 'stop': { const i = +b.dataset.i; V.closed[i] = !V.closed[i]; b.closest('.stop').classList.toggle('closed', V.closed[i]); b.setAttribute('aria-expanded', !V.closed[i]); { const xa = detailEl.querySelector('.xall'); const anyOpen = X.pts.some((p, j) => !V.closed[j]); const t = anyOpen ? 'Свернуть все точки' : 'Раскрыть все точки'; if (xa) { xa.setAttribute('aria-label', t); xa.title = t; xa.innerHTML = anyOpen ? EXPAND_ALL : COLLAPSED_ALL; } } break; }
      case 'seg': V.seg = b.dataset.seg; if (V.seg === 'tariff') V.edit = false; renderDetail(); if (V.seg === 'counter') { const f = $('dOffer'); if (f) { f.focus(); f.select(); } } break;
      case 'pay': V.pay = !V.pay; b.closest('.pay').classList.toggle('closed', !V.pay); b.setAttribute('aria-expanded', V.pay); break;
      case 'vat': S.vat = !S.vat; renderDetail(); break;
      case 'info': showInfo(b); break;
      case 'doc': { const i = +b.dataset.i; V.docs[i] = !V.docs[i]; b.closest('.doc').classList.toggle('open', V.docs[i]); b.setAttribute('aria-expanded', V.docs[i]); break; }
      case 'geo': {
        const v = b.dataset.geo;
        const done = () => { b.classList.add('done'); showTip(b, 'Скопировано'); clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove('done'); hideInfo(); }, 1600); };
        try { navigator.clipboard.writeText(v).then(done, done); } catch (err) { done(); }
        break;
      }
      case 'take': S.taken[o.id] = true; renderDetail(); toast('Заявка ' + o.id + ' забронирована за вами'); break;
      case 'close': V.seg = 'tariff'; V.edit = false; V.offer = ''; renderDetail(); break;
      case 'edit': V.edit = true; renderDetail(); { const f = $('dOffer'); if (f) { f.focus(); f.select(); } } break;
      case 'send': {
        const f = $('dOffer'); const v = parseInt((f ? f.value : '').replace(/\s/g, ''), 10);
        if (!v || v <= 0) { toast('Введите сумму больше нуля'); if (f) f.focus(); return; }
        S.offers[o.id] = v; S.offerAt[o.id] = Date.now(); V.offer = ''; V.edit = false; renderDetail(); toast('Встречное предложение ' + money(v) + ' отправлено');
        break;
      }
    }
  });
  function showInfo(b) {
    const tip = $('navTip'); if (!tip) return;
    tip.textContent = EXTRAS[+b.dataset.i][2];
    tip.style.whiteSpace = 'normal'; tip.style.width = '280px'; tip.style.height = 'auto'; tip.style.fontSize = '12px'; tip.style.lineHeight = '16px'; tip.style.fontWeight = '400'; tip.style.padding = '8px 12px';
    const r = b.getBoundingClientRect();
    tip.style.left = Math.min(r.right + 12, window.innerWidth - 292) + 'px'; tip.style.top = (r.top + r.height / 2) + 'px';
    requestAnimationFrame(() => tip.classList.add('show'));
  }
  function showTip(el, text) {
    const tip = $('navTip'); if (!tip) return;
    tip.style.cssText = ''; tip.textContent = text;
    const ic = [...el.querySelectorAll('.gi')].find((x) => getComputedStyle(x).display !== 'none');
    const r = (ic || el).getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(r.right + 12, window.innerWidth - tip.offsetWidth - 8)) + 'px'; tip.style.top = (r.top + r.height / 2) + 'px';
    requestAnimationFrame(() => tip.classList.add('show'));
  }
  $('list').addEventListener('mouseover', (e) => { const g = e.target.closest('[data-act="copy"]'); if (g && !g.contains(e.relatedTarget)) showTip(g, g.classList.contains('done') ? 'Скопировано' : 'Скопировать'); });
  $('list').addEventListener('mouseout', (e) => { const g = e.target.closest('[data-act="copy"]'); if (g && !g.contains(e.relatedTarget)) hideInfo(); });
  detailEl.addEventListener('mouseover', (e) => { const g = e.target.closest('.geo'); if (g && !g.contains(e.relatedTarget)) showTip(g, g.classList.contains('done') ? 'Скопировано' : 'Скопировать'); });
  detailEl.addEventListener('mouseout', (e) => { const g = e.target.closest('.geo'); if (g && !g.contains(e.relatedTarget)) hideInfo(); });
  detailEl.addEventListener('focusin', (e) => { const g = e.target.closest('.geo'); if (g && g.matches(':focus-visible')) showTip(g, 'Скопировать'); });
  detailEl.addEventListener('focusout', (e) => { if (e.target.closest('.geo')) hideInfo(); });
  const hideInfo = () => { const tip = $('navTip'); if (!tip) return; tip.classList.remove('show'); setTimeout(() => { if (!tip.classList.contains('show')) { tip.style.cssText = ''; } }, 150); };
  detailEl.addEventListener('mouseover', (e) => { const b = e.target.closest('.info'); if (b) showInfo(b); });
  detailEl.addEventListener('mouseout', (e) => { if (e.target.closest('.info')) hideInfo(); });
  detailEl.addEventListener('focusout', (e) => { if (e.target.closest('.info')) hideInfo(); });
  window.addEventListener('scroll', hideInfo, { passive: true });
  // scroll-spy: highlight the anchor tab of the section in view
  let spyRaf = 0;
  window.addEventListener('scroll', () => {
    if (V.id === null || spyRaf) return;
    spyRaf = requestAnimationFrame(() => {
      spyRaf = 0;
      const tabs = detailEl.querySelectorAll('.dtabs .tab'); if (!tabs.length) return;
      let cur = tabs[0].dataset.to;
      tabs.forEach((t) => { const sec = $('d-' + t.dataset.to); if (sec && sec.getBoundingClientRect().top <= 150) cur = t.dataset.to; });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) cur = tabs[tabs.length - 1].dataset.to;
      tabs.forEach((t) => t.classList.toggle('on', t.dataset.to === cur));
      const bar = detailEl.querySelector('.dtabs'); bar.classList.toggle('stuck', window.scrollY > 0 && Math.abs(bar.getBoundingClientRect().top - parseFloat(getComputedStyle(bar).top)) < 1);
    });
  }, { passive: true });
  detailEl.addEventListener('input', (e) => { if (e.target.id === 'dOffer') { e.target.value = e.target.value.replace(/[^\d\s]/g, ''); V.offer = e.target.value; } });
  detailEl.addEventListener('keydown', (e) => { if (e.target.id === 'dOffer' && e.key === 'Enter') { e.preventDefault(); detailEl.querySelector('[data-d="send"]').click(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && V.id !== null && $('modal').hidden && !document.querySelector('.menu.open')) { if (history.state && history.state.order) history.back(); else hideDetail(true); } });
  if (location.hash.length > 1) fromHash();

  applyChrome();
  render();
  fitSearch();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { hug(); fitSearch(); });
})();
</script>

</body>
</html>
